name: 构建 iOS IPA（TrollStore）

on:
  workflow_dispatch:        # 允许在 GitHub Actions 页面手动触发
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Web 依赖
        run: npm ci --no-audit --no-fund

      - name: 构建 Web 资源（dist/）
        run: npm run build

      - name: 同步 Web 资源到 iOS 工程（只拷贝资源，不动原生配置）
        run: npx cap copy ios

      - name: 兜底确保共享 scheme 存在（Blueprint ID 504EC3031FED79650016851F）
        run: |
          mkdir -p ios/App/App.xcodeproj/xcshareddata/xcschemes
          cat > ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1430"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "504EC3031FED79650016851F"
                         BuildableName = "App.app"
                         BlueprintName = "App"
                         ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv = "YES">
                <Testables>
                   <TestableReference
                      skipped = "NO">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "504EC3031FED79650016851F"
                         BuildableName = "App.app"
                         BlueprintName = "App"
                         ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>
                   </TestableReference>
                </Testables>
             </TestAction>
             <LaunchAction
                buildConfiguration = "Debug"
                selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "504EC3031FED79650016851F"
                      BuildableName = "App.app"
                      BlueprintName = "App"
                      ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction
                buildConfiguration = "Release"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "504EC3031FED79650016851F"
                      BuildableName = "App.app"
                      BlueprintName = "App"
                      ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction
                buildConfiguration = "Debug">
             </AnalyzeAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          EOF

      - name: 安装 CocoaPods（macOS runner 通常已自带）
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

      - name: pod install（拉取 Capacitor 原生依赖）
        working-directory: ios/App
        run: pod install

      - name: 调试：列出可用 scheme
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -list

      - name: 无签名 Archive（TrollStore 安装时会自动重签，无需苹果证书）
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release \
            -archivePath ./build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: 打包为无签名 IPA
        working-directory: ios/App
        run: |
          mkdir -p ./build/Payload
          cp -R "./build/App.xcarchive/Products/Applications/App.app" ./build/Payload/
          cd ./build
          zip -r "../build/InventoryManager.ipa" Payload

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: InventoryManager-IPA
          path: ios/App/build/InventoryManager.ipa
